<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Villa La Coste — Clients</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;1,300;1,400&family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500&display=swap');

:root {
  --gold: #b89a5a; --gold-l: #d4b97a; --gold-pale: #f5efe0;
  --cream: #faf7f2; --dark: #1a1714; --charcoal: #2d2926;
  --muted: #7a7067; --border: #e8e0d0;
  --green: #2d5a3d; --green-bg: #f0f7f2;
  --red: #8b3a2a; --red-bg: #fdf2f0;
  --blue: #2a4a6b; --blue-bg: #f0f4f8;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: 'DM Sans', sans-serif; background: var(--cream); color: var(--dark); height: 100vh; display: flex; flex-direction: column; overflow: hidden; }

/* HEADER */
header {
  background: var(--dark); padding: 1.1rem 2rem;
  display: flex; align-items: center; justify-content: space-between;
  border-bottom: 1px solid #2d2926; flex-shrink: 0;
}.logo {
  font-family: 'Cormorant Garamond', serif;
  font-size: 1.6rem;
  letter-spacing: .2em;
  text-transform: uppercase;
  color: var(--gold-pale)
  ;
}
.hstats { display: flex; gap: 2rem; }
.hstat { text-align: center; }
.hstat strong { display: block; font-family: 'Cormorant Garamond', serif; font-size: 1.4rem; font-weight: 400; color: var(--gold-l); line-height: 1; }
.hstat span { font-size: .65rem; letter-spacing: .1em; text-transform: uppercase; color: #666; }

/* SEARCH BAR */
.searchbar {
  background: var(--dark); padding: .9rem 2rem 1.1rem;
  border-bottom: 1px solid #2d2926; flex-shrink: 0;
}
.search-row { display: flex; gap: .8rem; align-items: center; }
.search-wrap { position: relative; flex: 1; max-width: 580px; }
.search-wrap svg { position: absolute; left: .9rem; top: 50%; transform: translateY(-50%); color: var(--gold); pointer-events: none; }
#q {
  width: 100%; padding: .75rem .9rem .75rem 2.7rem;
  background: rgba(255,255,255,.07); border: 1px solid #3d3830;
  border-radius: 5px; color: #fff;
  font-family: 'DM Sans', sans-serif; font-size: .9rem; outline: none;
  transition: border-color .2s;
}
#q::placeholder { color: #555; }
#q:focus { border-color: var(--gold); background: rgba(255,255,255,.1); }
.filters { display: flex; gap: .5rem; flex-wrap: wrap; margin-top: .7rem; }
.fb {
  padding: .3rem .8rem; border-radius: 20px; border: 1px solid #3d3830;
  background: transparent; color: #777; font-size: .7rem;
  letter-spacing: .07em; text-transform: uppercase; cursor: pointer;
  transition: all .15s; font-family: 'DM Sans', sans-serif;
}
.fb:hover, .fb.on { border-color: var(--gold); color: var(--gold-l); background: rgba(184,154,90,.12); }

/* LAYOUT */
.body { display: flex; flex: 1; overflow: hidden; }

/* LIST */
.list-panel { width: 320px; flex-shrink: 0; background: #fff; border-right: 1px solid var(--border); display: flex; flex-direction: column; overflow: hidden; }
.list-head { padding: .7rem 1.1rem; font-size: .68rem; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); border-bottom: 1px solid var(--border); background: var(--cream); flex-shrink: 0; display: flex; justify-content: space-between; align-items: center; }
#countLabel { color: var(--gold); font-weight: 500; }
.list-scroll { overflow-y: auto; flex: 1; }

.ci { padding: .8rem 1.1rem; border-bottom: 1px solid var(--border); cursor: pointer; display: flex; align-items: center; gap: .8rem; transition: background .1s; }
.ci:hover { background: var(--gold-pale); }
.ci.active { background: var(--gold-pale); border-left: 3px solid var(--gold); padding-left: calc(1.1rem - 3px); }
.av { width: 36px; height: 36px; border-radius: 50%; background: var(--dark); display: flex; align-items: center; justify-content: center; font-family: 'Cormorant Garamond', serif; font-size: .95rem; color: var(--gold-l); flex-shrink: 0; }
.ci-info { flex: 1; min-width: 0; }
.ci-name { font-size: .85rem; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.ci-sub { font-size: .72rem; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-top: 1px; }
.badge { background: var(--dark); color: var(--gold-l); font-size: .72rem; padding: .18rem .5rem; border-radius: 10px; flex-shrink: 0; font-family: 'Cormorant Garamond', serif; font-size: .82rem; }
.badge.hi { background: var(--gold); color: var(--dark); }

/* Pagination */
.pagination { padding: .7rem 1rem; border-top: 1px solid var(--border); display: flex; gap: .5rem; justify-content: center; flex-shrink: 0; }
.pgbtn { padding: .3rem .7rem; border: 1px solid var(--border); border-radius: 4px; background: #fff; cursor: pointer; font-size: .75rem; color: var(--muted); transition: all .15s; }
.pgbtn:hover, .pgbtn.cur { border-color: var(--gold); color: var(--gold); }

/* DETAIL */
.detail { flex: 1; overflow-y: auto; padding: 2rem 2.5rem; }

.empty { display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100%; gap: 1rem; color: var(--muted); text-align: center; }
.empty .ico { font-size: 3rem; opacity: .25; }
.empty p { font-family: 'Cormorant Garamond', serif; font-size: 1.2rem; font-style: italic; }

/* Client detail */
.chead { display: flex; gap: 1.4rem; margin-bottom: 1.8rem; padding-bottom: 1.4rem; border-bottom: 1px solid var(--border); align-items: flex-start; }
.av-lg { width: 60px; height: 60px; border-radius: 50%; background: var(--dark); display: flex; align-items: center; justify-content: center; font-family: 'Cormorant Garamond', serif; font-size: 1.6rem; color: var(--gold-l); flex-shrink: 0; }
.ctitle h1 { font-family: 'Cormorant Garamond', serif; font-size: 1.7rem; font-weight: 400; }
.ctitle .nat { font-style: italic; color: var(--muted); font-size: .9rem; margin-top: 2px; }
.tags { display: flex; gap: .5rem; flex-wrap: wrap; margin-top: .6rem; }
.tag { font-size: .65rem; padding: .22rem .65rem; border-radius: 20px; letter-spacing: .05em; text-transform: uppercase; font-weight: 500; }
.tg { background: var(--green-bg); color: var(--green); }
.tb { background: var(--blue-bg); color: var(--blue); }
.tgold { background: var(--gold-pale); color: var(--gold); border: 1px solid #dcc88a; }
.tr { background: var(--red-bg); color: var(--red); }

.igrid { display: grid; grid-template-columns: 1fr 1fr; gap: .9rem; margin-bottom: 1.8rem; }
.icard { background: #fff; border: 1px solid var(--border); border-radius: 7px; padding: 1rem 1.2rem; }
.icard.full { grid-column: 1/-1; }
.ilabel { font-size: .62rem; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); margin-bottom: .35rem; }
.ivalue { font-size: .88rem; color: var(--dark); line-height: 1.6; word-break: break-word; }
.ivalue.big { font-family: 'Cormorant Garamond', serif; font-size: 2.2rem; font-weight: 300; color: var(--gold); line-height: 1; }
.ivalue a { color: var(--gold); text-decoration: none; }
.ivalue a:hover { text-decoration: underline; }

.stitle { font-family: 'Cormorant Garamond', serif; font-size: 1rem; letter-spacing: .08em; text-transform: uppercase; color: var(--charcoal); margin-bottom: .8rem; padding-bottom: .35rem; border-bottom: 1px solid var(--border); display: flex; align-items: center; gap: .4rem; }

/* Notes */
.notes-block { background: #fff; border-left: 3px solid var(--gold); border: 1px solid var(--border); border-left: 3px solid var(--gold); border-radius: 0 7px 7px 0; padding: 1rem 1.2rem; font-size: .82rem; line-height: 1.8; color: var(--charcoal); white-space: pre-wrap; word-break: break-word; margin-bottom: 1.8rem; max-height: 280px; overflow-y: auto; }

/* Séjours */
.sejlist { display: flex; flex-direction: column; gap: .5rem; margin-bottom: 2rem; }
.srow { background: #fff; border: 1px solid var(--border); border-radius: 7px; overflow: hidden; }
.srow-head { padding: .75rem 1.1rem; display: grid; grid-template-columns: 52px 1fr auto auto auto; align-items: center; gap: .8rem; cursor: pointer; transition: background .12s; }
.srow-head:hover { background: var(--gold-pale); }
.snum { font-family: 'Cormorant Garamond', serif; font-size: 1rem; color: var(--gold); font-weight: 500; }
.sdates { font-size: .83rem; font-weight: 500; }
.sdates small { color: var(--muted); font-weight: 400; font-size: .75rem; margin-left: .35rem; }
.schambre { font-size: .75rem; color: var(--muted); text-align: right; }
.spers { font-size: .75rem; color: var(--muted); white-space: nowrap; }
.starif { font-size: .7rem; padding: .18rem .6rem; background: var(--gold-pale); color: var(--gold); border-radius: 10px; white-space: nowrap; }
.snotes { display: none; padding: .8rem 1.1rem; background: #fffdf8; border-top: 1px solid var(--border); font-size: .8rem; line-height: 1.75; color: var(--charcoal); white-space: pre-wrap; word-break: break-word; }
.snotes.open { display: block; }

/* Loading spinner */
.spinner { display: none; width: 16px; height: 16px; border: 2px solid #333; border-top-color: var(--gold); border-radius: 50%; animation: spin .6s linear infinite; }
.spinner.on { display: inline-block; }
@keyframes spin { to { transform: rotate(360deg); } }

/* Scrollbar */
::-webkit-scrollbar { width: 4px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--border); border-radius: 10px; }
</style>
</head>
<body>

<header>
  <div class="logo">Villa La Coste</div>
  <div class="hstats">
    <div class="hstat"><strong>{{ nb_clients }}</strong><span>Clients</span></div>
    <div class="hstat"><strong>{{ nb_sejours }}</strong><span>Séjours</span></div>
    <div class="hstat"><strong>{{ nb_nations }}</strong><span>Nationalités</span></div>
    <div class="hstat"><strong>{{ nb_fichiers }}</strong><span>Fichier{{ 's' if nb_fichiers > 1 }}</span></div>
  </div>
</header>

<div class="searchbar">
  <div class="search-row">
    <div class="search-wrap">
      <svg width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
      <input type="text" id="q" placeholder="Nom, prénom, email, téléphone…" autocomplete="off">
    </div>
    <div class="spinner" id="spinner"></div>
  </div>
  <div class="filters">
    <button class="fb on" data-f="all">Tous</button>
    <button class="fb" data-f="Déjà venu">⭐ Déjà venu</button>
    <button class="fb" data-f="Liste bloquée">🚫 Bloqués</button>
    <button class="fb" data-f="multi">🔁 3+ séjours</button>
  </div>
</div>

<div class="body">
  <div class="list-panel">
    <div class="list-head">
      <span><span id="countLabel">—</span> résultats</span>
      <span id="pageLabel" style="font-size:.65rem;color:#bbb"></span>
    </div>
    <div class="list-scroll" id="listScroll"></div>
    <div class="pagination" id="pagination"></div>
  </div>

  <div class="detail" id="detail">
    <div class="empty">
      <div class="ico">⚜</div>
      <p>Sélectionnez un client</p>
      <small style="color:var(--muted);font-size:.75rem">Recherchez par nom, prénom, email ou téléphone</small>
    </div>
  </div>
</div>

<script>
let currentPage = 1;
let currentFilter = 'all';
let currentQ = '';
let debounceTimer;
let activeKey = null; // "NOM|PRENOM"

function initials(nom, prenom) {
  return ((nom||'')[0]||'').toUpperCase() + ((prenom||'')[0]||'').toUpperCase() || '?';
}

function catShort(cat) {
  return (cat||'')
    .replace('Villa Suite Piscine 2 chambres','VSP2')
    .replace('Villa Suite Piscine','VSP')
    .replace('Villa Suite','VS')
    .replace('Studios Château','SC')
    .replace('Studios Villa','SV')
    .replace('Pavillon Suite','PS')
    .replace('Appartement','Appt');
}

// ── Load list ────────────────────────────────────────────────────────
async function loadList(page=1) {
  currentPage = page;
  document.getElementById('spinner').classList.add('on');
  const params = new URLSearchParams({ q: currentQ, filtre: currentFilter, page });
  const res  = await fetch('/api/clients?' + params);
  const data = await res.json();
  document.getElementById('spinner').classList.remove('on');

  document.getElementById('countLabel').textContent = data.total.toLocaleString('fr');
  document.getElementById('pageLabel').textContent = data.pages > 1 ? `Page ${data.page}/${data.pages}` : '';

  // Render items
  const scroll = document.getElementById('listScroll');
  if (!data.clients.length) {
    scroll.innerHTML = '<div style="padding:2rem;text-align:center;color:var(--muted);font-size:.83rem">Aucun résultat</div>';
  } else {
    scroll.innerHTML = data.clients.map(c => {
      const key = `${c.nom}|${c.prenom}`;
      const isActive = key === activeKey;
      const isHi = c.nb_sejours >= 3;
      const sub = [c.nationalite, c.email].filter(Boolean).join(' · ') || c.classification || '—';
      return `<div class="ci${isActive?' active':''}" onclick='loadClient("${encodeURIComponent(c.nom)}","${encodeURIComponent(c.prenom)}")'>
        <div class="av">${initials(c.nom,c.prenom)}</div>
        <div class="ci-info">
          <div class="ci-name">${c.nom}${c.prenom?' '+c.prenom:''}</div>
          <div class="ci-sub">${sub}</div>
        </div>
        <div class="badge${isHi?' hi':''}">${c.nb_sejours}</div>
      </div>`;
    }).join('');
  }

  // Pagination
  const pg = document.getElementById('pagination');
  if (data.pages <= 1) { pg.innerHTML=''; return; }
  let html = '';
  if (currentPage > 1) html += `<button class="pgbtn" onclick="loadList(${currentPage-1})">←</button>`;
  for (let p=Math.max(1,currentPage-2); p<=Math.min(data.pages,currentPage+2); p++) {
    html += `<button class="pgbtn${p===currentPage?' cur':''}" onclick="loadList(${p})">${p}</button>`;
  }
  if (currentPage < data.pages) html += `<button class="pgbtn" onclick="loadList(${currentPage+1})">→</button>`;
  pg.innerHTML = html;
}

// ── Load client detail ──────────────────────────────────────────────
async function loadClient(nomEnc, prenomEnc) {
  const nom = decodeURIComponent(nomEnc);
  const prenom = decodeURIComponent(prenomEnc);
  activeKey = `${nom}|${prenom}`;

  // Update active state in list
  document.querySelectorAll('.ci').forEach(el => {
    const name = el.querySelector('.ci-name').textContent.trim();
    const expected = nom + (prenom ? ' '+prenom : '');
    el.classList.toggle('active', name === expected);
  });

  const detail = document.getElementById('detail');
  detail.innerHTML = '<div class="empty"><div class="ico" style="animation:spin 1s linear infinite">⚜</div></div>';

  const res = await fetch(`/api/client/${nomEnc}/${prenomEnc}`);
  const c   = await res.json();

  if (c.error) {
    detail.innerHTML = `<div class="empty"><p>${c.error}</p></div>`;
    return;
  }

  // Tags
  const tags = [
    c.classification==='Déjà venu'     ? '<span class="tag tg">⭐ Déjà venu</span>' : '',
    c.classification==='Liste bloquée' ? '<span class="tag tr">🚫 Bloqué</span>' : '',
    c.classification==='Compte Paymaster'?'<span class="tag tb">💳 Paymaster</span>':'',
    c.nb_sejours>=10 ? '<span class="tag tgold">👑 VIP</span>' : c.nb_sejours>=5 ? '<span class="tag tgold">⚜ Fidèle</span>' : '',
  ].filter(Boolean).join('');

  // Séjours
  const sejoursHtml = c.sejours.map((s,i) => {
    const hasNotes = s.notes && s.notes.trim();
    return `<div class="srow">
      <div class="srow-head" onclick="toggleN(${i})">
        <div class="snum">#${s.numero}</div>
        <div class="sdates">${s.arrivee} → ${s.depart}<small>${s.nuits} nuit${s.nuits>1?'s':''}</small></div>
        <div class="schambre">${catShort(s.categorie)} Ch.${s.chambre}</div>
        <div class="spers">👤 ${s.personnes||'?'}</div>
        <div class="starif">${s.tarif||'—'}</div>
      </div>
      ${hasNotes ? `<div class="snotes" id="sn${i}">${s.notes}</div>` : ''}
    </div>`;
  }).join('');

  detail.innerHTML = `
    <div class="chead">
      <div class="av-lg">${initials(c.nom,c.prenom)}</div>
      <div class="ctitle">
        <h1>${c.nom}${c.prenom?' '+c.prenom:''}</h1>
        <div class="nat">${c.nationalite||''}</div>
        <div class="tags">${tags}</div>
      </div>
    </div>

    <div class="igrid">
      <div class="icard"><div class="ilabel">Séjours à VLC</div><div class="ivalue big">${c.nb_sejours}</div></div>
      <div class="icard"><div class="ilabel">Nationalité</div><div class="ivalue">${c.nationalite||'—'}</div></div>
      <div class="icard"><div class="ilabel">Email</div><div class="ivalue">${c.email?`<a href="mailto:${c.email}">${c.email}</a>`:'—'}</div></div>
      <div class="icard"><div class="ilabel">Téléphone</div><div class="ivalue">${c.telephone?`<a href="tel:${c.telephone}">${c.telephone}</a>`:'—'}</div></div>
      ${c.adresse?`<div class="icard full"><div class="ilabel">Adresse</div><div class="ivalue">${c.adresse}</div></div>`:''}
      <div class="icard"><div class="ilabel">Classification</div><div class="ivalue">${c.classification||'—'}</div></div>
    </div>

    ${c.notes_client ? `
      <div class="stitle">📋 Notes client</div>
      <div class="notes-block">${c.notes_client}</div>` : ''}

    <div class="stitle">🗓 Historique des séjours</div>
    <div class="sejlist">${sejoursHtml}</div>
  `;
}

function toggleN(i) {
  const el = document.getElementById('sn'+i);
  if (el) el.classList.toggle('open');
}

// ── Events ───────────────────────────────────────────────────────────
document.getElementById('q').addEventListener('input', e => {
  clearTimeout(debounceTimer);
  debounceTimer = setTimeout(() => {
    currentQ = e.target.value.trim();
    loadList(1);
  }, 250);
});

document.querySelectorAll('.fb').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.fb').forEach(b => b.classList.remove('on'));
    btn.classList.add('on');
    currentFilter = btn.dataset.f;
    loadList(1);
  });
});

// Init
loadList(1);
</script>
</body>
</html>
